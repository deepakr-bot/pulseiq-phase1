name: Refresh dashboard data

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install packages
        run: pip install -r phase-4/task17/requirements.txt
      - name: Export aggregates
        run: python phase-4/task17/export_aggregates.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add phase-4/task17/data
          git diff --cached --quiet || (git commit -m "Refresh dashboard data" && git push)